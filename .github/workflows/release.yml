name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions:
  contents: write # version commits and tags
  pull-requests: write # the "Version packages" PR
  id-token: write # npm Trusted Publishing (OIDC) and provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs npm 11.5.1+ (Node 22 ships npm 10). No token: npm exchanges the
      # workflow's OIDC identity for a short-lived publish credential and adds provenance itself.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # With pending changesets this opens or updates a "Version packages" PR. When that PR is
      # merged (no changesets left), it publishes every @cajunsystems/mirage-* package whose version is not on npm.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
